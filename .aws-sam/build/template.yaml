AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple Calculator Lambda with API
Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 128
Resources:
  CalculatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: CalculatorFunction
      Policies:
      - AWSLambdaBasicExecutionRole
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /calculate
            Method: post
    Metadata:
      SamResourceId: CalculatorFunction
Outputs:
  ApiUrl:
    Description: Endpoint URL
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/calculate
